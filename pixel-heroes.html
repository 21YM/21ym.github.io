<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.E Pixel Heroes | Play Online RPG</title>
    
    <link rel="icon" type="image/png" href="logo1.png">

    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="B.E Pixel Heroes | Online Pixel Art RPG">
    <meta property="og:description" content="Play the online pixel-art RPG directly in your browser.">
    <meta property="og:image" content="banner-pixel-heroes.jpg">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0b0914;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="game-wrapper">
        <!-- El juego carga directamente y ocupa toda la pantalla -->
        <iframe 
            id="game-iframe" 
            src="be-pixelheroes/index.html" 
            allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById('game-iframe');

        // Capturar token de Google OAuth si venimos de redirección y pasárselo al juego
        if (window.location.hash && window.location.hash.includes('access_token=')) {
            iframe.src = 'be-pixelheroes/index.html' + window.location.hash;
            window.history.replaceState(null, null, window.location.pathname);
        }

        // Mantener el foco en el juego automáticamente para que respondan los controles y el teclado
        window.addEventListener('click', () => {
            if (iframe) iframe.focus();
        });
        
        window.addEventListener('load', () => {
            if (iframe) iframe.focus();
        });
    </script>
</body>
</html>
