<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.E Pixel Heroes | Play Online RPG</title>
    
    <link rel="icon" type="image/png" href="logo1.png">

    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="B.E Pixel Heroes | Online Pixel Art RPG">
    <meta property="og:description" content="Play the online pixel-art RPG directly in your browser.">
    <meta property="og:image" content="banner-pixel-heroes.jpg">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #fbbf24;
            --bg-dark: #0b0914;
            --pixel-font: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor principal que llena toda la ventana manteniendo proporción o expandiendo */
        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Botón flotante discreto de Pantalla Completa en una esquina */
        .btn-floating-fullscreen {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(22, 21, 43, 0.85);
            border: 2px solid var(--primary);
            color: var(--primary);
            font-family: var(--pixel-font);
            font-size: 0.65rem;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 9999;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-floating-fullscreen:hover {
            background: var(--primary);
            color: #000;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="game-wrapper">
        <!-- Botón flotante para alternar pantalla completa real -->
        <button class="btn-floating-fullscreen" onclick="toggleFullscreen()">
            <i class="fas fa-expand"></i> <span id="fs-text">FULLSCREEN</span>
        </button>

        <!-- El juego carga directamente dentro del iframe apuntando a tu carpeta -->
        <iframe 
            id="game-iframe" 
            src="be-pixelheroes/index.html" 
            allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const wrapper = document.getElementById('game-wrapper');
        const iframe = document.getElementById('game-iframe');

        // Capturar token de Google OAuth si venimos de redirección y pasárselo al juego
        if (window.location.hash && window.location.hash.includes('access_token=')) {
            iframe.src = 'be-pixelheroes/index.html' + window.location.hash;
            window.history.replaceState(null, null, window.location.pathname);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (wrapper.requestFullscreen) {
                    wrapper.requestFullscreen();
                } else if (wrapper.webkitRequestFullscreen) {
                    wrapper.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
            iframe.focus();
        }

        // Mantener el foco en el juego para que funcionen las teclas al hacer clic
        window.addEventListener('click', () => {
            if (iframe) iframe.focus();
        });
    </script>
</body>
</html>
