<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.E Pixel Heroes | Play Online RPG</title>
    
    <link rel="icon" type="image/png" href="logo1.png">

    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="B.E Pixel Heroes | Online Pixel Art RPG">
    <meta property="og:description" content="Play the online pixel-art RPG directly in your browser or download on Android!">
    <meta property="og:image" content="banner-pixel-heroes.jpg">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Fuente estilo Pixel Art (Press Start 2P) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0b0914;
            --pixel-gold: #ffcc00;
            --pixel-green: #25e054;
            --pixel-border: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive, monospace;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Banner Pixel Art Superior */
        .pixel-banner {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: #181425;
            border: 4px solid var(--pixel-border);
            box-shadow: 0 6px 0 #000, 0 0 15px rgba(0,0,0,0.8);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-radius: 2px;
            /* Efecto Pixel Art Sharp Edge */
            image-rendering: pixelated;
        }

        .pixel-banner p {
            color: #fff;
            font-size: 10px;
            line-height: 1.4;
            text-shadow: 2px 2px #000;
        }

        .pixel-banner p span {
            color: var(--pixel-gold);
        }

        /* Botón estilo Arcade/Pixel */
        .playstore-btn {
            background-color: var(--pixel-green);
            color: #000;
            text-decoration: none;
            font-size: 9px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            border: 3px solid #fff;
            box-shadow: inset -3px -3px 0px 0px #11782a, 3px 3px 0px 0px #000;
            transition: all 0.1s ease;
            cursor: pointer;
            white-space: nowrap;
        }

        .playstore-btn:hover {
            background-color: #2eff65;
            transform: scale(1.03);
            box-shadow: inset -3px -3px 0px 0px #11782a, 4px 4px 0px 0px #000;
        }

        .playstore-btn:active {
            transform: translate(2px, 2px);
            box-shadow: inset 3px 3px 0px 0px #11782a, 1px 1px 0px 0px #000;
        }

        .playstore-btn i {
            font-size: 14px;
        }

        /* Botón para cerrar/ocultar banner si molesta */
        .close-banner {
            background: none;
            border: none;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 5px;
            line-height: 1;
        }

        .close-banner:hover {
            color: #ff4444;
        }

        /* Contenedor del Iframe */
        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .game-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Responsivo para móviles */
        @media (max-width: 600px) {
            .pixel-banner {
                width: 90%;
                flex-direction: column;
                gap: 8px;
                text-align: center;
                top: 8px;
                padding: 8px;
            }
            .pixel-banner p {
                font-size: 8px;
            }
            .playstore-btn {
                font-size: 8px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Banner Pixel Art Superior para promocionar la versión móvil -->
    <div class="pixel-banner" id="pixel-banner">
        <p>📱 PLAY ON THE GO! <span>GET THE MOBILE APP</span></p>
        
        <!-- SUSTITUYE ESTE ENLACE CON TU URL REAL DE GOOGLE PLAY -->
        <a href="https://play.google.com/store/apps/details?id=TU_PACKAGE_NAME" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="playstore-btn">
            <i class="fa-brands fa-google-play"></i> GOOGLE PLAY
        </a>

        <button class="close-banner" onclick="document.getElementById('pixel-banner').style.display='none';" title="Close notification">✕</button>
    </div>

    <div class="game-wrapper" id="game-wrapper">
        <!-- El juego carga directamente en pantalla completa -->
        <iframe 
            id="game-iframe" 
            src="be-pixelheroes/index.html" 
            allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById('game-iframe');

        // Capturar token de Google OAuth si venimos de redirección y pasárselo al juego
        if (window.location.hash && window.location.hash.includes('access_token=')) {
            iframe.src = 'be-pixelheroes/index.html' + window.location.hash;
            window.history.replaceState(null, null, window.location.pathname);
        }

        // Mantener el foco en el juego automáticamente para que respondan los controles y el teclado
        window.addEventListener('click', (e) => {
            // Evitamos quitar el foco si el usuario pulsa sobre el enlace de Google Play
            if (!e.target.closest('#pixel-banner') && iframe) {
                iframe.focus();
            }
        });
        
        window.addEventListener('load', () => {
            if (iframe) iframe.focus();
        });
    </script>
</body>
</html>
